name: Build PathoRogue Offline Windows EXE

on:
  push:
    branches:
      - pathorogue-windows-build
    paths:
      - pathorogue/**
      - .github/workflows/build-pathorogue-exe.yml
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      POKEROGUE_COMMIT: '31665e5a420fe6c619c84173b9c679b33eadf861'
      # Phaser 4 uses a different rendering pipeline. The optional Phaser 3
      # memory patches target removed classes and are unrelated to the quiz.
      MEMORY_PATCHES_ENABLED: 'false'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.5

      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Fetch pinned PokeRogue and asset revisions
        shell: bash
        run: |
          git init pokerogue-src
          git -C pokerogue-src remote add origin https://github.com/pagefaultgames/pokerogue.git
          git -C pokerogue-src fetch --depth 1 origin "$POKEROGUE_COMMIT"
          git -C pokerogue-src checkout --detach FETCH_HEAD
          git -C pokerogue-src submodule update --init --recursive --depth 1
          git -C pokerogue-src rev-parse HEAD
          git -C pokerogue-src submodule status

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        shell: bash
        run: bash scripts/apply-patches.sh exe

      - name: Integrate Pathophysiology questions into original PokéRogue
        run: node pathorogue/install.cjs pokerogue-src

      - name: Test Pathophysiology selection and battle enforcement
        run: node --test pathorogue/*.test.cjs

      - name: Verify 687-subsection Pathophysiology gate
        shell: bash
        run: |
          test -s pokerogue-src/src/mods/nursing-content.ts
          test -s pokerogue-src/src/mods/nursing-gate.ts
          grep -q PATHOROGUE_SUBSECTION_GATE_V1 pokerogue-src/src/phases/move-effect-phase.ts

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        run: pnpm add -D electron@43.0.0 electron-builder@26.15.3

      - name: Install Discord Rich Presence dependency
        working-directory: pokerogue-src
        # Not a devDependency - discord-rpc.cjs requires() this at runtime
        # in the packaged app, so it needs to actually ship in node_modules.
        run: pnpm add @xhayper/discord-rpc@1.5.1

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        shell: bash
        # See the identical step in build-appimage.yml — google-drive-backup.ts
        # dynamically imports @capgo/capacitor-social-login behind an
        # isCapacitor() check that's always false here, but Vite/Rolldown
        # still needs the package resolvable at build time.
        run: pnpm add @capacitor/core@8.4.1 @capgo/capacitor-social-login@8.3.33

      - name: Convert app icon to ICO
        shell: pwsh
        run: |
          magick ${{ github.workspace }}\docs\appIcon.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            ${{ github.workspace }}\docs\appIcon.ico
          Write-Host "ICO created at ${{ github.workspace }}\docs\appIcon.ico"

      - name: Install shared offline build flag independently of memory patches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pokerogue-src/src/system/offline | Out-Null
          Copy-Item -LiteralPath new-files/src/system/offline/scooom-dev.ts -Destination pokerogue-src/src/system/offline/scooom-dev.ts

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Keep PathoRogue renderer from replacing itself with vanilla updates
        run: node pathorogue/protect-mod.cjs pokerogue-src renderer

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build:app

      - name: Apply post-build patches
        shell: bash
        run: bash scripts/apply-post-build-patches.sh exe

      - name: Verify compiled quiz runtime is in build output
        run: node pathorogue/verify-build.cjs --dist pokerogue-src/dist

      - name: Copy Electron config files into place
        shell: bash
        run: |
          cp configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp configs/desktop/electron/preload.cjs pokerogue-src/preload.cjs
          cp configs/desktop/electron/updater.cjs pokerogue-src/updater.cjs
          cp configs/desktop/electron/discord-rpc.cjs pokerogue-src/discord-rpc.cjs
          cp configs/desktop/electron/electron-builder.windows.json pokerogue-src/electron-builder.json
          cp docs/appIcon.ico pokerogue-src/appIcon.ico

      - name: Inject build number into updater.cjs
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}
          target-file: pokerogue-src/updater.cjs

      - name: Inject real app version into updater.cjs
        uses: ./.github/actions/inject-app-version

      - name: Inject Discord client ID into discord-rpc.cjs
        uses: ./.github/actions/inject-discord-client-id
        with:
          target-file: pokerogue-src/discord-rpc.cjs
          discord-client-id: ${{ vars.DISCORD_CLIENT_ID }}

      - name: Inject Google OAuth credentials into main.cjs
        uses: ./.github/actions/inject-google-desktop-oauth
        with:
          client-id: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          client-secret: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Inject Dropbox App Key
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/main.cjs
          dropbox-app-key: ${{ inputs.dev && vars.DROPBOX_APP_KEY_DEV || vars.DROPBOX_APP_KEY }}

      - name: Set electron main in package.json
        uses: ./.github/actions/set-electron-package-metadata

      - name: Get 3 Num Version
        id: old_ver
        uses: ./.github/actions/get-electron-package-version

      - name: Keep PathoRogue desktop from installing vanilla updates
        run: node pathorogue/protect-mod.cjs pokerogue-src desktop

      - name: Generate Windows EXE
        working-directory: pokerogue-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          WIN_CSC_LINK: ''
        run: pnpm electron-builder --win portable --publish never --config electron-builder.json --config.extraMetadata.version=${{ steps.old_ver.outputs.version }} --config.directories.output=release-pathorogue --config.artifactName=PathoRogueOffline.exe

      - name: Rename and save EXE
        id: exe_path
        shell: pwsh
        run: |
          $portable = Join-Path $PWD 'pokerogue-src/release-pathorogue/PathoRogueOffline.exe'
          if (!(Test-Path -LiteralPath $portable)) { throw 'Portable EXE was not produced at the expected path' }
          $outputName = if ('${{ inputs.dev }}' -eq 'true') { 'PathoRogueOffline-dev.exe' } else { 'PathoRogueOffline.exe' }
          Copy-Item -LiteralPath $portable -Destination $outputName
          "exe=$outputName" >> $env:GITHUB_OUTPUT

      - name: Launch the actual portable EXE offline and verify quiz tracker
        run: node pathorogue/verify-build.cjs --exe ${{ steps.exe_path.outputs.exe }} --report-dir verification

      - name: Play real battles in the downloadable EXE offline
        run: node pathorogue/gameplay-smoke.cjs --exe ${{ steps.exe_path.outputs.exe }} --report-dir verification/gameplay

      - name: Upload runtime verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PathoRogue-Windows-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathoRogueOffline-Windows${{ inputs.dev && '-dev' || '' }}
          path: ${{ steps.exe_path.outputs.exe }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
